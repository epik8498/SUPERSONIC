<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUPERSONIC RIDER</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SUPERSONIC RIDER</h1>
        <p>라이더 업무 관리</p>
    </header>

    <main>
        <section class="status-card">
            <h2>오늘의 근무 상태</h2>
            <p id="workStatus">퇴근 상태입니다.</p>
        </section>

        <section class="button-area">
            <button id="startButton">출근하기</button>
            <button id="endButton">퇴근하기</button>
        </section>

        <section class="menu-card">
            <h2>내 정보</h2>
            <p>라이더 정보와 업무 내역을 확인할 수 있습니다.</p>
        </section>
    </main>

    <script src="script.js"></script>
    <script type="module" src="firebase.js"></script>
    <script src="script.js"></script>

</body>
</html>
